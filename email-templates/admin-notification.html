<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Lead Notification</title>
</head>
<body style="margin:0;padding:0;background-color:#f6f3ec;font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f6f3ec;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background-color:#fffcf7;border:1px solid #e4dfd4;border-radius:8px;overflow:hidden;">
          <tr>
            <td style="padding:28px 32px 20px 32px;border-bottom:1px solid #e4dfd4;text-align:center;">
              <img src="https://www.elhubventures.com/assets/images/logo.png" alt="EL-HUB VENTURES" width="168" height="56" style="display:block;margin:0 auto 12px auto;border:0;outline:none;text-decoration:none;height:auto;max-width:168px;">
              <p style="margin:0;font-family:Georgia,'Source Serif 4',serif;font-size:22px;line-height:1.3;color:#12151c;letter-spacing:0.04em;">
                EL-HUB <span style="font-weight:400;color:#8a6d14;">VENTURES</span>
              </p>
              <p style="margin:10px 0 0 0;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#4a5160;">
                New Lead Notification
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f6f3ec;border:1px solid #e4dfd4;border-left:4px solid #8a6d14;border-radius:8px;">
                <tr>
                  <td style="padding:24px;">
                    <p style="margin:0 0 6px 0;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#4a5160;">Name</p>
                    <p style="margin:0 0 18px 0;font-size:16px;line-height:1.5;color:#12151c;">{{name}}</p>

                    <p style="margin:0 0 6px 0;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#4a5160;">Email</p>
                    <p style="margin:0 0 18px 0;font-size:16px;line-height:1.5;">
                      <a href="mailto:{{email}}" style="color:#8a6d14;text-decoration:none;">{{email}}</a>
                    </p>

                    <p style="margin:0 0 6px 0;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#4a5160;">Service Needed</p>
                    <p style="margin:0 0 18px 0;font-size:16px;line-height:1.5;color:#12151c;">{{service}}</p>

                    <p style="margin:0 0 6px 0;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#4a5160;">Estimated Budget</p>
                    <p style="margin:0 0 18px 0;font-size:16px;line-height:1.5;color:#12151c;">{{budget}}</p>

                    <p style="margin:0 0 6px 0;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#4a5160;">Timeline</p>
                    <p style="margin:0 0 18px 0;font-size:16px;line-height:1.5;color:#12151c;">{{timeline}}</p>

                    <p style="margin:0 0 8px 0;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#4a5160;">Project Details</p>
                    <div style="background-color:#fffcf7;border:1px solid #e4dfd4;border-radius:4px;padding:14px 16px;font-size:14px;line-height:1.7;color:#12151c;white-space:pre-wrap;">{{message}}</div>
                  </td>
                </tr>
              </table>

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:28px;">
                <tr>
                  <td align="center">
                    <a href="mailto:{{email}}" style="display:inline-block;background-color:#8a6d14;color:#ffffff;text-decoration:none;padding:13px 26px;font-size:14px;font-weight:600;border-radius:4px;letter-spacing:0.02em;">
                      Reply to Lead
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px 28px 32px;border-top:1px solid #e4dfd4;text-align:center;">
              <p style="margin:0;font-size:12px;line-height:1.6;color:#4a5160;">
                Code. Connect. Conquer.<br>
                <a href="https://www.elhubventures.com" style="color:#8a6d14;text-decoration:none;">www.elhubventures.com</a><br>
                12 Garba A Idris St, Kado, Abuja 900108
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
